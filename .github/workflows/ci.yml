name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Deliberately no env: the build must succeed without any Supabase or
      # other secrets (CLAUDE.md "run the build without .env.local").
      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Everything that needs a real database: RLS tests with real user JWTs, a
  # check that the generated types match the migrations, and the auth E2E
  # (sign-in, invites, onboarding) against a build pointed at the local stack.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase (applies migrations)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - name: Generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts

      - name: RLS tests
        run: npm run db:test:rls

      - name: Build against local Supabase
        run: node scripts/with-local-supabase.mjs npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Auth E2E
        run: npm run test:e2e:local

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-db
          path: playwright-report/
          retention-days: 7
