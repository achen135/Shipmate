name: Watch

# The 30-minute watcher (worker/run.ts). Notes:
# - Primary trigger: Supabase pg_cron calls GitHub's workflow_dispatch API at
#   :13 and :43 (migration `…_watch_dispatcher.sql`). GitHub's own schedule
#   only fired every 5-6 hours in practice, so it is the fallback here.
# - Scheduled workflows only run from the default branch (main), and so does
#   the dispatch (`"ref": "main"`).
# - GitHub disables schedules in a public repo after 60 days with no repo
#   activity. M8 adds a staleness alert on `runs`.
# - Missing secrets make the worker skip with a warning annotation, not fail.

on:
  schedule:
    # Off the top of the hour, when GitHub drops the most scheduled runs.
    - cron: "13,43 * * * *"
  workflow_dispatch: # pg_cron, or by hand from the Actions tab

permissions:
  contents: read

# Never let two runs overlap; a slow run delays the next instead of racing it.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run worker
        run: npm run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
