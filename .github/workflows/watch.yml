name: Watch

# The 30-minute watcher (worker/run.ts). Notes:
# - Primary trigger: Supabase pg_cron calls GitHub's workflow_dispatch API at
#   :13 and :43 (migration `…_watch_dispatcher.sql`). GitHub's own schedule
#   only fired every 5-6 hours in practice, so it is the fallback here.
# - Scheduled workflows only run from the default branch (main), and so does
#   the dispatch (`"ref": "main"`).
# - GitHub disables schedules in a public repo after 60 days with no repo
#   activity. M8 adds a staleness alert on `runs`.
# - Missing secrets make the worker skip with a warning annotation, not fail.
# - After matching it also drains the tailoring queue (worker/tailor.ts), so
#   it needs Chromium for the PDFs and the key that decrypts users' own AI
#   keys; tailor.yml does the same on demand.

on:
  schedule:
    # Off the top of the hour, when GitHub drops the most scheduled runs.
    - cron: "13,43 * * * *"
  workflow_dispatch: # pg_cron, or by hand from the Actions tab

permissions:
  contents: read

# Never let two runs overlap; a slow run delays the next instead of racing it.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and the resume font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-cmu

      - name: Run worker
        run: npm run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Read-only here (permissions: contents: read). Used for the
          # aggregator commit-SHA checks so they get the authenticated rate
          # limit (1,000/h) instead of 60/h per runner IP.
          GITHUB_TOKEN: ${{ github.token }}
          # Notifications (worker/notify.ts). The worker sends: Web Push needs
          # the VAPID pair, the email fallback needs an SMTP account. Any that
          # are missing are skipped with a warning annotation, never a failure.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Where the email's "Open your Inbox" link goes.
          APP_URL: https://shipmate-jobs.vercel.app
          # Tailoring: decrypts users' own AI keys (the same value as
          # Vercel's). Missing: their tailorings wait, with a warning.
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY }}
